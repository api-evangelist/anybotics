name: ANYbotics
description: 'ANYbotics is a Swiss deep-tech robotics company that builds ANYmal, an autonomous
  four-legged inspection robot used to automate routine and hazardous industrial inspections across
  power and utilities, oil and gas, mining, chemicals, and metals. Its platform pairs the legged robot
  with inspection-management software and analytics to increase plant uptime, cut costs, and remove
  workers from dangerous areas. ANYbotics is backed by Bessemer Venture Partners. No public developer
  API, SDK, or OpenAPI surface is exposed; this API Evangelist profile currently captures the company''s
  published security and trust posture.'
